<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="hero-section text-center">
            <div class="container">
                <span class="eyebrow">Sistema de Gestión</span>
                <h1>Epicentro Gourmet</h1>
                <p class="mb-4">Festivales, unidades de venta y personal en un solo lugar.</p>
                <div th:if="${username == null}">
                    <a th:href="@{/registro/unidad}" class="btn btn-primary btn-lg mr-2">Registrar unidad de venta</a>
                    <a th:href="@{/login}" class="btn btn-outline-light btn-lg">Iniciar sesión</a>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Festivales</h5>
            </div>
            <div class="card-body">
                <p class="text-muted mb-0" th:if="${festivales == null or festivales.isEmpty()}">No hay festivales cargados.</p>
                <div class="table-responsive" th:unless="${festivales == null or festivales.isEmpty()}">
                    <table class="table table-striped table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Temporada</th>
                                <th>Inicio</th>
                                <th>Fin</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="festival : ${festivales}">
                                <td th:text="${festival.nombre}"></td>
                                <td th:text="${festival.temporada}"></td>
                                <td th:text="${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')}"></td>
                                <td th:text="${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
