<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Epicentro Gourmet - Sistema de Gestión</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/epicentro.css}"/>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" th:fragment="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/index}">Epicentro Gourmet</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/index}">Inicio</a>
                    </li>
                    <li class="nav-item" th:if="${username == null}">
                        <a class="nav-link" th:href="@{/registro/unidad}">Registrar unidad de venta</a>
                    </li>
                    <li class="nav-item" th:if="${esAdmin}">
                        <a class="nav-link" th:href="@{/admin/festivales}">Festivales</a>
                    </li>
                    <li class="nav-item" th:if="${esResponsable}">
                        <a class="nav-link" th:href="@{/responsable/empleados}">Empleados</a>
                    </li>
                    <li class="nav-item" th:if="${esResponsable}">
                        <a class="nav-link" th:href="@{/responsable/liquidaciones}">Liquidación de haberes</a>
                    </li>
                    <li class="nav-item" th:if="${username != null}">
                        <a class="nav-link" th:href="@{/pedidos/nuevo}">Nuevo pedido</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item" th:if="${username == null}">
                        <a class="nav-link" th:href="@{/login}">Iniciar sesión</a>
                    </li>
                    <li class="nav-item dropdown" th:if="${username != null}">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-toggle="dropdown">
                            <span th:text="${username}">Usuario</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right">
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Cerrar sesión</button>
                            </form>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Footer -->
    <footer class="py-4" th:fragment="footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Epicentro Gourmet · Sistema de Gestión</p>
        </div>
    </footer>

    <!-- Scripts -->
    <div th:fragment="scripts">
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </div>

</body>
</html>
