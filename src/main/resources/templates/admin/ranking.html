<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header">
            <a th:href="@{/admin/festivales}">&larr; Volver a festivales</a>
            <h2 class="mt-2">Ranking de unidades · <span th:text="${festival.nombre}">Festival</span></h2>
            <p class="text-muted mb-0">
                <span th:text="${festival.temporada}"></span> ·
                <span th:text="${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')}"></span> al
                <span th:text="${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')}"></span>
            </p>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Unidades ordenadas por recaudación</h5>
            </div>
            <div class="card-body">
                <p class="text-muted mb-0" th:if="${ranking.isEmpty()}">Este festival todavía no tiene unidades de venta registradas.</p>
                <div class="table-responsive" th:unless="${ranking.isEmpty()}">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre comercial</th>
                                <th>Código</th>
                                <th>Tipo</th>
                                <th>Responsable</th>
                                <th class="text-right">Pedidos</th>
                                <th class="text-right">Recaudación</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="unidad, stat : ${ranking}">
                                <td th:text="${stat.count}"></td>
                                <td th:text="${unidad.nombreComercial}"></td>
                                <td th:text="${unidad.codigoUnico}"></td>
                                <td th:text="${unidad.tipo.descripcion}"></td>
                                <td th:text="${unidad.responsable}"></td>
                                <td class="text-right" th:text="${unidad.cantidadPedidos}"></td>
                                <td class="text-right font-weight-bold"
                                    th:text="'$ ' + ${#numbers.formatDecimal(unidad.recaudacion, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
