<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header">
            <a th:href="@{/admin/festivales}">&larr; Volver a festivales</a>
            <h2 class="mt-2">Unidades con mayor canon · <span th:text="${festival.nombre}">Festival</span></h2>
            <p class="text-muted mb-0">
                <span th:text="${festival.temporada}"></span> ·
                <span th:text="${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')}"></span> al
                <span th:text="${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')}"></span>
            </p>
        </div>

        <div class="card">
            <div class="card-header">
                <form class="form-inline" method="get"
                      th:action="@{/admin/festivales/{id}/mayores-canon(id=${festival.id})}">
                    <label for="cantidad" class="mr-2">Cantidad de unidades</label>
                    <input type="number" min="1" id="cantidad" name="cantidad" class="form-control form-control-sm mr-2"
                           style="width: 90px" th:value="${cantidad}">
                    <button type="submit" class="btn btn-primary btn-sm">Ver</button>
                </form>
            </div>
            <div class="card-body">
                <div class="alert alert-danger" th:each="error : ${errores}" th:text="${error.mensaje}"></div>
                <p class="text-muted mb-0" th:if="${errores.isEmpty() and reporte.isEmpty()}">Este festival todavía no tiene unidades de venta registradas.</p>
                <div class="table-responsive" th:unless="${reporte.isEmpty()}">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Nombre comercial</th>
                                <th>Código</th>
                                <th>Tipo</th>
                                <th class="text-right">Canon</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="unidad, stat : ${reporte}">
                                <td th:text="${stat.count}"></td>
                                <td th:text="${unidad.nombreComercial}"></td>
                                <td th:text="${unidad.codigoUnico}"></td>
                                <td th:text="${unidad.tipo.descripcion}"></td>
                                <td class="text-right font-weight-bold"
                                    th:text="'$ ' + ${#numbers.formatDecimal(unidad.canon, 1, 'POINT', 2, 'COMMA')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
