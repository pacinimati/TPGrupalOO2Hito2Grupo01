<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header">
            <a th:href="@{/admin/festivales}">&larr; Volver a festivales</a>
            <h2 class="mt-2" th:text="${festival.nombre}">Festival</h2>
            <p class="text-muted mb-0">
                <span th:text="${festival.temporada}"></span> ·
                <span th:text="${#temporals.format(festival.fechaInicio, 'dd/MM/yyyy')}"></span> al
                <span th:text="${#temporals.format(festival.fechaFin, 'dd/MM/yyyy')}"></span>
            </p>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Unidades de venta (<span th:text="${unidades.size()}">0</span>)</h5>
            </div>
            <div class="card-body">
                <p class="text-muted mb-0" th:if="${unidades.isEmpty()}">Este festival todavía no tiene unidades de venta registradas.</p>
                <div class="table-responsive" th:unless="${unidades.isEmpty()}">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Nombre comercial</th>
                                <th>Código</th>
                                <th>Tipo</th>
                                <th>Superficie</th>
                                <th>Responsable</th>
                                <th>Detalle</th>
                                <th>Reporte</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="unidad : ${unidades}">
                                <td th:text="${unidad.nombreComercial}"></td>
                                <td th:text="${unidad.codigoUnico}"></td>
                                <td th:text="${unidad.tipo.descripcion}"></td>
                                <td th:text="${#numbers.formatDecimal(unidad.superficieM2, 1, 2, 'COMMA')} + ' m²'"></td>
                                <td th:text="${unidad.responsable}"></td>
                                <td class="text-muted" th:switch="${unidad.tipo.name()}">
                                    <span th:case="'FOOD_TRUCK'"
                                          th:text="'Patente ' + ${unidad.patente} + (${unidad.conexionElectrica} ? ' · Con conexión eléctrica' : ' · Sin conexión eléctrica')"></span>
                                    <span th:case="'PUESTO_DESARMABLE'"
                                          th:text="${unidad.carpasComponen} + ' carpa(s) · ' + ${unidad.tiempoMontaje} + ' min de montaje'"></span>
                                </td>
                                <td>
                                    <a class="btn btn-outline-primary btn-sm"
                                       th:href="@{/admin/festivales/{festivalId}/unidades/{unidadVentaId}/rentabilidad(festivalId=${festival.id}, unidadVentaId=${unidad.id})}">
                                        Rentabilidad neta
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
