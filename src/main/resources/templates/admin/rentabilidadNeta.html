<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header">
            <a th:href="@{/admin/festivales/{id}/unidades(id=${festival.id})}">&larr; Volver a unidades</a>
            <h2 class="mt-2">Rentabilidad neta · <span th:text="${reporte.nombreUnidad}">Unidad</span></h2>
            <p class="text-muted mb-0">
                <span th:text="${festival.nombre}">Festival</span> ·
                <span th:text="${festival.temporada}"></span>
            </p>
        </div>

        <div th:replace="~{fragments/rentabilidadNeta :: detalle(${reporte})}"></div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
