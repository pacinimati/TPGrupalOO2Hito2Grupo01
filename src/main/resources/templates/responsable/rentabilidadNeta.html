<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="container py-4">
        <div class="page-header">
            <a th:href="@{/responsable/empleados}">&larr; Volver a empleados</a>
            <h2 class="mt-2">Rentabilidad neta</h2>
            <p class="text-muted mb-0" th:if="${unidad != null}">
                Unidad de venta <strong th:text="${unidad.nombreComercial}"></strong>
                (<span th:text="${unidad.codigoUnico}"></span>) ·
                <span th:text="${unidad.festival}"></span>
                <span th:if="${unidad.fechaInicio != null and unidad.fechaFin != null}">
                    · <span th:text="${#temporals.format(unidad.fechaInicio, 'dd/MM/yyyy')}"></span>
                    al <span th:text="${#temporals.format(unidad.fechaFin, 'dd/MM/yyyy')}"></span>
                </span>
            </p>
            <p class="mt-3 mb-0" th:if="${unidad != null and unidad.fechaInicio != null and unidad.fechaFin != null}">
                <a class="btn btn-outline-primary btn-sm" th:href="@{/responsable/rentabilidad/periodo}">
                    Rentabilidad neta por período
                </a>
            </p>
        </div>

        <div class="card" th:if="${reporte == null}">
            <div class="card-body">
                <p class="text-muted mb-0" th:if="${unidad == null}">No tenés una unidad de venta asignada.</p>
                <p class="text-muted mb-0" th:if="${unidad != null}">Tu unidad de venta no tiene un festival asociado.</p>
            </div>
        </div>

        <th:block th:if="${reporte != null}">
            <div th:replace="~{fragments/rentabilidadNeta :: detalle(${reporte})}"></div>
        </th:block>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>
